<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A browser-first 3D exploration prototype."
    />
    <meta name="theme-color" content="#071311" />
    <title>TheCocoon — Field test 001</title>
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game-canvas" aria-label="3D exploration game"></canvas>
      <header class="top-bar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>TheCocoon</span>
          <span class="divider">/</span>
          <span class="edition">Field test 001</span>
        </div>
        <span class="mode-label"><span></span> Solo preview</span>
      </header>
      <section class="intro" aria-live="polite">
        <p class="eyebrow">A quiet signal, somewhere ahead</p>
        <h1 id="status-title">Find the signal.</h1>
        <p id="status-copy">A distant beacon is waiting to be discovered.</p>
      </section>
      <div class="reticle" aria-hidden="true"></div>
      <div id="proximity-hint" class="proximity-hint" hidden>
        <kbd>E</kbd> &nbsp; Investigate
      </div>
      <footer class="bottom-bar">
        <div class="controls">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</span>
          <span><span class="mouse-icon" aria-hidden="true"></span> Look</span>
          <span><kbd>E</kbd> Interact</span>
        </div>
        <span class="build-label">Prototype · 0.1</span>
      </footer>
    </main>
    <script type="module" src="/platforms/web/main.ts"></script>
  </body>
</html>
